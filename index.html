<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff5000">
<title>幸运数字</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff5000'/><text x='50' y='68' font-size='55' font-weight='900' fill='white' text-anchor='middle' font-family='Arial'>M</text></svg>">
<meta name="application-name" content="MarkSix">
<meta name="apple-mobile-web-app-title" content="MarkSix">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  body {
    padding-bottom: env(safe-area-inset-bottom);
  }
  button {
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    min-height: 44px;
  }

  /* 顶部导航栏 */
  .header {
    background: linear-gradient(135deg, #ff5000 0%, #ff6a00 50%, #ff8c00 100%);
    padding: env(safe-area-inset-top) 0 0 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(255, 80, 0, 0.25);
  }
  .header-inner {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    gap: 12px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 40px;
    height: 40px;
    background: #fff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #ff5000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .logo-text {
    color: #fff;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .logo-sub {
    color: rgba(255,255,255,0.8);
    font-size: 10px;
    margin-top: 1px;
  }

  /* 主按钮 */
  .btn-primary {
    background: #fff;
    color: #ff5000;
    border: none;
    border-radius: 22px;
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    min-width: 100px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .btn-primary:active:not(:disabled) {
    transform: scale(0.95);
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-primary.drawing {
    background: linear-gradient(135deg, #ff5000, #ff8c00);
    color: #fff;
  }

  /* 主内容区 */
  .main {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
  }

  /* 开奖信息 */
  .draw-info {
    text-align: center;
    margin-bottom: 16px;
    min-height: 24px;
    font-size: 14px;
    color: #666;
    font-weight: 500;
  }
  .draw-info .current { color: #ff5000; font-weight: 800; font-size: 16px; }
  .draw-info .special { color: #e63946; font-weight: 800; }

  /* 球区域 - 严格一行，不换行，无滚动条 */
  .balls-area {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: nowrap;
    gap: 8px;
    padding: 24px 12px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    margin-bottom: 16px;
    min-height: 120px;
    overflow: hidden;
    box-sizing: border-box;
  }

  /* 开奖按钮区域 */
  .draw-area {
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
  }
  .btn-large {
    padding: 14px 48px;
    font-size: 18px;
    min-width: 200px;
  }

  .ball-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .ball {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    position: relative;
    transition: transform 0.2s ease;
    will-change: transform;
  }

  /* 普通球 - 橙色 */
  .ball.normal {
    background: radial-gradient(circle at 30% 30%, #ff8c00, #ff5000 60%, #cc4000);
    box-shadow: 0 3px 10px rgba(255, 80, 0, 0.35), inset 0 -3px 6px rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.3);
  }

  /* 特码球 - 橙色（默认），结果时根据数字变色 */
  .ball.special {
    background: radial-gradient(circle at 30% 30%, #ff8c00, #ff5000 60%, #cc4000);
    box-shadow: 0 3px 10px rgba(255, 80, 0, 0.35), inset 0 -3px 6px rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.3);
  }

  /* 六合彩颜色 - 滚动和结果时都根据数字变色 */
  .ball.color-red {
    background: radial-gradient(circle at 30% 30%, #ff7675, #d63031 60%, #a02020);
  }
  .ball.color-blue {
    background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3 60%, #0652a0);
  }
  .ball.color-green {
    background: radial-gradient(circle at 30% 30%, #55efc4, #00b894 60%, #008060);
  }
  /* 特码球保留金色边框（结果时） */
  .ball.special.result.color-red,
  .ball.special.result.color-blue,
  .ball.special.result.color-green {
    box-shadow: 0 3px 12px rgba(0,0,0,0.3), inset 0 -3px 6px rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.3), 0 0 0 2px rgba(255, 215, 0, 0.7);
  }

  /* 球高光 */
  .ball::before {
    content: "";
    position: absolute;
    top: 12%;
    left: 18%;
    width: 35%;
    height: 25%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.6) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .ball-num {
    position: relative;
    z-index: 5;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4), 0 0 8px rgba(255,255,255,0.3);
    line-height: 1;
    font-weight: 900;
  }
  .ball-zodiac {
    position: relative;
    z-index: 1;
    font-size: 10px;
    font-weight: 600;
    opacity: 0.9;
    margin-top: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .ball-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 等待状态 - 静止不动 */
  .ball.waiting {
    /* 无动画，球静止不动 */
  }
  .ball.waiting .ball-num {
    opacity: 0.3;
    font-size: 26px;
    animation: questionPulse 2s ease-in-out infinite;
  }
  @keyframes questionPulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.15); opacity: 0.5; }
  }

  /* 结果光环 */
  .ball.result::before {
    animation: haloPulse 1s ease-out;
  }
  @keyframes haloPulse {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.8); }
    100% { box-shadow: 0 0 0 30px rgba(255,255,255,0); }
  }

  /* 滚动状态 - JS控制跳动，CSS只做基础过渡 */
  .ball.rolling {
    transition: transform 0.05s ease-out;
  }
  .ball.rolling.normal {
    box-shadow: 0 0 20px rgba(255, 80, 0, 0.7), 0 3px 10px rgba(255, 80, 0, 0.35), inset 0 -3px 6px rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.3);
  }
  .ball.rolling.special {
    box-shadow: 0 0 25px rgba(230, 57, 70, 0.8), 0 3px 12px rgba(230, 57, 70, 0.4), inset 0 -3px 6px rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.3), 0 0 0 2px rgba(255, 215, 0, 0.7);
  }

  /* 结果状态 - 数字清晰为主，动画点缀 */
  .ball.result {
    animation: ballResult 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes ballResult {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .ball.result .ball-num {
    animation: numPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both;
  }
  @keyframes numPop {
    0% { transform: scale(0.5); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .ball.result .ball-zodiac {
    animation: zodiacFade 0.4s ease 0.2s both;
    z-index: 5;
    position: relative;
  }
  @keyframes zodiacFade {
    0% { opacity: 0; transform: translateY(5px); }
    100% { opacity: 0.95; transform: translateY(0); }
  }
  .ball.result.special {
    animation: ballResultSpecial 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes ballResultSpecial {
    0% { transform: scale(0.3) rotate(-180deg); opacity: 0; }
    50% { transform: scale(1.3) rotate(10deg); }
    75% { transform: scale(0.9) rotate(-5deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .ball-label {
    font-size: 10px;
    color: #999;
    font-weight: 600;
  }
  .ball-label.special-label { color: #e63946; font-weight: 700; }

  .ball-sep {
    font-size: 32px;
    color: #1a1a1a;
    font-weight: 900;
    margin: 0 4px;
    align-self: flex-start;
    margin-top: 14px;
    text-shadow: none;
    line-height: 1;
  }

  /* 按钮区 */
  .action-area {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .btn-outline {
    background: #fff;
    color: #666;
    border: 1.5px solid #e0e0e0;
    border-radius: 20px;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .btn-outline:active:not(:disabled) {
    transform: scale(0.96);
    border-color: #ff5000;
    color: #ff5000;
    background: #fff5f0;
  }
  .btn-outline:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 历史记录 */
  .history-area {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .history-title {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .history-title::before {
    content: "";
    width: 3px;
    height: 14px;
    background: linear-gradient(180deg, #ff5000, #ff8c00);
    border-radius: 2px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: #fafafa;
    border-radius: 8px;
  }
  .history-index {
    font-size: 11px;
    color: #999;
    font-weight: 600;
    min-width: 32px;
  }
  .history-balls {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    flex: 1;
  }
  .history-ball {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
  }
  .history-ball.normal {
    background: radial-gradient(circle at 30% 30%, #ff8c00, #ff5000);
  }
  .history-ball.special {
    background: radial-gradient(circle at 30% 30%, #ff6b6b, #e63946);
    box-shadow: 0 0 0 1.5px rgba(255, 215, 0, 0.5);
  }
  .history-ball.color-red {
    background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
  }
  .history-ball.color-blue {
    background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3);
  }
  .history-ball.color-green {
    background: radial-gradient(circle at 30% 30%, #55efc4, #00b894);
  }
  .history-ball.special.color-red,
  .history-ball.special.color-blue,
  .history-ball.special.color-green {
    box-shadow: 0 0 0 1.5px rgba(255, 215, 0, 0.6);
  }
  .history-time {
    font-size: 10px;
    color: #bbb;
    min-width: 50px;
    text-align: right;
  }
  .history-empty {
    text-align: center;
    padding: 24px;
    color: #ccc;
    font-size: 12px;
  }

  /* 粒子特效 */
  .particle-box {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: visible;
    z-index: 2;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: particleFly 0.9s ease-out forwards;
  }
  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg); opacity: 0; }
  }
  /* 星星粒子 */
  .star-particle {
    border-radius: 0;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: starFly 1.1s ease-out forwards;
  }
  @keyframes starFly {
    0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; }
    20% { transform: translate(calc(var(--tx) * 0.2), calc(var(--ty) * 0.2)) scale(1.2) rotate(90deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(540deg); opacity: 0; }
  }
  /* 冲击波（低调点缀） */
  .shockwave {
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 20px;
    border: 2px solid rgba(255, 215, 0, 0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: shockwaveExpand 0.7s ease-out forwards;
    pointer-events: none;
  }
  @keyframes shockwaveExpand {
    0% { width: 20px; height: 20px; opacity: 0.5; border-width: 2px; }
    100% { width: 100px; height: 100px; opacity: 0; border-width: 1px; }
  }

  /* 小屏适配 - 确保7球严格一行 */
  @media (max-width: 400px) {
    .ball { width: 44px; height: 44px; font-size: 17px; }
    .ball.waiting .ball-num { font-size: 20px; }
    .ball-zodiac { font-size: 9px; }
    .balls-area { gap: 5px; padding: 16px 8px; }
    .ball-sep { font-size: 24px; margin-top: 10px; }
    .ball-label { font-size: 9px; }
    .btn-large { padding: 12px 36px; font-size: 16px; min-width: 160px; }
  }

  /* 超小屏适配（320px以下） */
  @media (max-width: 340px) {
    .ball { width: 38px; height: 38px; font-size: 15px; }
    .ball.waiting .ball-num { font-size: 18px; }
    .ball-zodiac { font-size: 8px; }
    .balls-area { gap: 3px; padding: 14px 6px; }
    .ball-sep { font-size: 20px; margin-top: 8px; margin: 0 2px; }
    .ball-label { font-size: 8px; }
    .btn-large { padding: 10px 28px; font-size: 15px; min-width: 140px; }
  }

  /* 横屏适配 */
  @media (max-height: 500px) and (orientation: landscape) {
    .header-inner { padding: 8px 16px; }
    .main { padding: 12px 16px 20px; }
    .balls-area { padding: 16px; min-height: 100px; }
    .ball { width: 50px; height: 50px; font-size: 20px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">数</div>
      <div>
        <div class="logo-text">幸运数字</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="draw-info" id="drawInfo">点击「开始开奖」，幸运号码即将揭晓</div>

  <div class="balls-area" id="ballsArea"></div>

  <div class="draw-area">
    <button class="btn-primary btn-large" id="drawBtn">开始开奖</button>
  </div>

  <div class="action-area">
    <button class="btn-outline" id="resetBtn">重置</button>
    <button class="btn-outline" id="clearBtn">清空历史</button>
  </div>

  <div class="history-area">
    <div class="history-title">历史开奖记录</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">暂无开奖记录</div>
    </div>
  </div>
</main>

<script>
(function() {
  'use strict';

  // 配置
  var CONFIG = {
    NORMAL_COUNT: 6,
    MIN_NUMBER: 1,
    MAX_NUMBER: 49,
    ROLL_DURATION: 3000,
    ROLL_SPEED: 50,
    BETWEEN_DELAY: 250
  };

  // 状态
  var balls = [];
  var isDrawing = false;
  var history = [];
  var soundEnabled = true;
  var audioCtx = null;

  // DOM元素
  var drawBtn, resetBtn, clearBtn, ballsArea, drawInfo, historyList;

  // 初始化音频上下文（需要用户交互后才能创建）
  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {
        audioCtx = null;
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 播放滚动音效（短促嘀声）
  function playRollSound() {
    if (!soundEnabled || !audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880 + Math.random() * 200;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.05);
    } catch(e) {}
  }

  // 播放结果音效（响亮叮声，C大调和弦，所有数字统一）
  function playResultSound() {
    if (!soundEnabled || !audioCtx) return;
    try {
      var frequencies = [523.25, 659.25, 783.99, 1046.50]; // C大调和弦
      var volume = 0.18;
      frequencies.forEach(function(freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        var startTime = audioCtx.currentTime + i * 0.03;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);
        osc.start(startTime);
        osc.stop(startTime + 0.5);
      });
    } catch(e) {}
  }

  // 工具函数
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // 六合彩生肖对应规则（每年更新，与当前年份关联）
  // 规则：数字1 = 当年生肖，数字2 = 上一个生肖，数字3 = 再上一个...（倒序）
  // 当年生肖对应5个数字：1, 13, 25, 37, 49；其余生肖各4个数字
  // 例：2026马年 → 马:01,13,25,37,49  蛇:02,14,26,38  龙:03,15,27,39...
  var ZODIACS = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
  var currentYear = new Date().getFullYear();
  // 2026年是马年（索引6），每年生肖往前推一位
  var yearZodiacIndex = ((currentYear - 2026 + 6) % 12 + 12) % 12;

  // 计算数字对应的六合彩生肖
  function getZodiac(num) {
    // 生肖索引 = (当年生肖索引 - (数字 - 1)) % 12（倒序）
    var index = ((yearZodiacIndex - (num - 1)) % 12 + 12) % 12;
    return ZODIACS[index];
  }

  // 六合彩颜色（红波/蓝波/绿波）
  var RED_BALLS = [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46];
  var BLUE_BALLS = [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48];
  var GREEN_BALLS = [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49];

  function getBallColor(num) {
    if (RED_BALLS.indexOf(num) !== -1) return 'red';
    if (BLUE_BALLS.indexOf(num) !== -1) return 'blue';
    return 'green';
  }

  // 生成号码 - 不重复，但不排序，按开出顺序显示
  function generateNumbers() {
    var all = [];
    for (var i = CONFIG.MIN_NUMBER; i <= CONFIG.MAX_NUMBER; i++) all.push(i);
    // Fisher-Yates 洗牌
    for (var i = all.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = all[i]; all[i] = all[j]; all[j] = tmp;
    }
    // 前6个普通号码（不排序，按洗牌顺序），第7个特码
    var normal = all.slice(0, CONFIG.NORMAL_COUNT);
    var special = all[CONFIG.NORMAL_COUNT];
    return { normal: normal, special: special };
  }

  // 创建球
  function createBall(index, isSpecial) {
    var wrap = document.createElement('div');
    wrap.className = 'ball-wrap';

    var ball = document.createElement('div');
    ball.className = 'ball ' + (isSpecial ? 'special' : 'normal') + ' waiting';
    ball.id = 'ball_' + index;
    ball.innerHTML = '<div class="ball-inner"><span class="ball-num">?</span><span class="ball-zodiac"></span></div>';

    var label = document.createElement('div');
    label.className = 'ball-label' + (isSpecial ? ' special-label' : '');
    label.textContent = isSpecial ? '特码' : ('第' + (index + 1) + '个');

    wrap.appendChild(ball);
    wrap.appendChild(label);
    return wrap;
  }

  // 初始化球
  function initBalls() {
    ballsArea.innerHTML = '';
    balls = [];
    for (var i = 0; i < CONFIG.NORMAL_COUNT; i++) {
      var wrap = createBall(i, false);
      ballsArea.appendChild(wrap);
      balls.push({ el: wrap.querySelector('.ball'), value: null, isSpecial: false });
    }
    var sep = document.createElement('div');
    sep.className = 'ball-sep';
    sep.textContent = '+';
    ballsArea.appendChild(sep);
    var specialWrap = createBall(CONFIG.NORMAL_COUNT, true);
    ballsArea.appendChild(specialWrap);
    balls.push({ el: specialWrap.querySelector('.ball'), value: null, isSpecial: true });
  }

  // 粒子特效 - 点缀为主，不遮数字
  function createParticles(ballEl, isSpecial) {
    var box = document.createElement('div');
    box.className = 'particle-box';
    var colors = isSpecial
      ? ['#ffd700', '#ff8c00', '#ffffff', '#ff6b6b']
      : ['#ff8c00', '#ffb700', '#ffffff', '#ff5000'];
    var count = isSpecial ? 18 : 14;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < count; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = rand(3, 8);
      var angle = rand(0, Math.PI * 2);
      var dist = rand(50, 110);
      var color = pick(colors);
      var delay = rand(0, 0.1);
      p.style.cssText =
        'width:' + size + 'px;height:' + size + 'px;' +
        'background:' + color + ';' +
        'box-shadow:0 0 ' + (size * 1.5) + 'px ' + color + ';' +
        'left:50%;top:50%;' +
        '--tx:' + (Math.cos(angle) * dist) + 'px;' +
        '--ty:' + (Math.sin(angle) * dist) + 'px;' +
        'animation-delay:' + delay + 's;' +
        'opacity:0.7;';
      frag.appendChild(p);
    }
    // 少量星星点缀
    for (var j = 0; j < 4; j++) {
      var star = document.createElement('div');
      star.className = 'particle star-particle';
      var starSize = rand(5, 10);
      var starAngle = rand(0, Math.PI * 2);
      var starDist = rand(60, 120);
      var starColor = pick(['#ffd700', '#ffffff', '#ffeb3b']);
      star.style.cssText =
        'width:' + starSize + 'px;height:' + starSize + 'px;' +
        'background:' + starColor + ';' +
        'box-shadow:0 0 ' + (starSize * 2) + 'px ' + starColor + ';' +
        'left:50%;top:50%;' +
        '--tx:' + (Math.cos(starAngle) * starDist) + 'px;' +
        '--ty:' + (Math.sin(starAngle) * starDist) + 'px;' +
        'opacity:0.6;';
      frag.appendChild(star);
    }
    // 淡冲击波（低调）
    var shockwave = document.createElement('div');
    shockwave.className = 'shockwave';
    frag.appendChild(shockwave);
    box.appendChild(frag);
    ballEl.style.position = 'relative';
    ballEl.appendChild(box);
    setTimeout(function() { box.remove(); }, 1000);
  }

  // 单个球开奖
  function drawBall(ballObj, finalValue, ballIndex) {
    return new Promise(function(resolve) {
      var ballEl = ballObj.el;
      var numEl = ballEl.querySelector('.ball-num');
      var zodiacEl = ballEl.querySelector('.ball-zodiac');
      var label = ballObj.isSpecial ? '特码' : ('第' + (ballIndex + 1) + '个号码');
      var finalZodiac = getZodiac(finalValue);
      var finalColor = getBallColor(finalValue);
      drawInfo.innerHTML = '正在开出 <span class="' + (ballObj.isSpecial ? 'special' : 'current') + '">' + label + '</span>...';

      ballEl.classList.remove('waiting');
      ballEl.classList.add('rolling');

      // 统一更新函数：数字、生肖、颜色、跳动、音效 一次完成
      var bounceCount = 0;
      function updateBall(n, bounceScale) {
        numEl.textContent = n;
        zodiacEl.textContent = getZodiac(n);
        // 更新颜色（先移除旧颜色，再加新颜色）
        ballEl.classList.remove('color-red', 'color-blue', 'color-green');
        ballEl.classList.add('color-' + getBallColor(n));
        // 跳动效果（和数字变化完全同步）
        var rotate = (bounceCount % 2 === 0 ? 1 : -1) * rand(1, 4);
        var translateY = -rand(2, 6) * bounceScale;
        ballEl.style.transform = 'scale(' + bounceScale + ') rotate(' + rotate + 'deg) translateY(' + translateY + 'px)';
        bounceCount++;
        // 播放滚动音效
        playRollSound();
        // 50ms后回弹
        setTimeout(function() {
          ballEl.style.transform = 'scale(1) rotate(0deg) translateY(0)';
        }, 40);
      }

      // 快速滚动阶段（2秒，50ms/次 = 40次）
      var fastRoll = setInterval(function() {
        var n = randInt(CONFIG.MIN_NUMBER, CONFIG.MAX_NUMBER);
        updateBall(n, rand(1.05, 1.12));
      }, CONFIG.ROLL_SPEED);

      setTimeout(function() {
        clearInterval(fastRoll);
        // 减速阶段（逐渐变慢，共约1秒）
        var slowSpeeds = [120, 160, 200, 260, 340];
        var slowScales = [1.1, 1.08, 1.06, 1.04, 1.02];
        var slowIdx = 0;
        function slowRoll() {
          if (slowIdx >= slowSpeeds.length) {
            // 最终结果
            ballEl.classList.remove('rolling');
            ballEl.style.transform = '';
            ballEl.classList.add('result');
            // 设置最终颜色
            ballEl.classList.remove('color-red', 'color-blue', 'color-green');
            ballEl.classList.add('color-' + finalColor);
            numEl.textContent = finalValue;
            zodiacEl.textContent = finalZodiac;
            ballObj.value = finalValue;
            createParticles(ballEl, ballObj.isSpecial);
            // 播放结果音效
            playResultSound();
            if (ballObj.isSpecial) {
              drawInfo.innerHTML = '🎉 特码开出 <span class="special">' + finalValue + ' ' + finalZodiac + '</span>！';
            } else {
              drawInfo.innerHTML = '第' + (ballIndex + 1) + '个号码开出 <span class="current">' + finalValue + ' ' + finalZodiac + '</span>';
            }
            setTimeout(resolve, 300);
            return;
          }
          var n = randInt(CONFIG.MIN_NUMBER, CONFIG.MAX_NUMBER);
          updateBall(n, slowScales[slowIdx]);
          slowIdx++;
          setTimeout(slowRoll, slowSpeeds[slowIdx - 1]);
        }
        slowRoll();
      }, 2000);
    });
  }

  // 顺序开奖
  function sequentialDraw() {
    if (isDrawing) return;
    initAudio(); // 初始化音频上下文（需要用户交互）
    isDrawing = true;
    drawBtn.disabled = true;
    drawBtn.classList.add('drawing');
    drawBtn.textContent = '开奖中...';
    resetBtn.disabled = true;
    clearBtn.disabled = true;

    initBalls();

    setTimeout(function() {
      var numbers = generateNumbers();
      var allValues = numbers.normal.concat([numbers.special]);

      var idx = 0;
      function next() {
        if (idx >= balls.length) {
          setTimeout(function() {
            drawInfo.innerHTML = '🎉 开奖完成！';
            saveHistory(numbers);
            renderHistory();
            isDrawing = false;
            drawBtn.disabled = false;
            drawBtn.classList.remove('drawing');
            drawBtn.textContent = '再开一次';
            resetBtn.disabled = false;
            clearBtn.disabled = false;
          }, 400);
          return;
        }
        drawBall(balls[idx], allValues[idx], idx).then(function() {
          idx++;
          if (idx < balls.length) {
            setTimeout(next, CONFIG.BETWEEN_DELAY);
          } else {
            next();
          }
        });
      }
      next();
    }, 200);
  }

  // 重置
  function reset() {
    if (isDrawing) return;
    initBalls();
    drawInfo.textContent = '点击「开始开奖」，幸运号码即将揭晓';
    drawBtn.textContent = '开始开奖';
  }

  // 历史记录
  function saveHistory(numbers) {
    var now = new Date();
    var timeStr = (now.getMonth() + 1) + '/' + now.getDate() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    history.unshift({ normal: numbers.normal, special: numbers.special, time: timeStr });
    if (history.length > 20) history.pop();
    try { localStorage.setItem('lucky_history', JSON.stringify(history)); } catch(e) {}
  }

  function loadHistory() {
    try {
      var saved = localStorage.getItem('lucky_history');
      if (saved) history = JSON.parse(saved) || [];
    } catch(e) { history = []; }
  }

  function renderHistory() {
    if (history.length === 0) {
      historyList.innerHTML = '<div class="history-empty">暂无开奖记录</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < history.length; i++) {
      var item = history[i];
      html += '<div class="history-item">';
      html += '<div class="history-index">#' + (history.length - i) + '</div>';
      html += '<div class="history-balls">';
      for (var j = 0; j < item.normal.length; j++) {
        var c = getBallColor(item.normal[j]);
        html += '<div class="history-ball normal color-' + c + '">' + item.normal[j] + '</div>';
      }
      var sc = getBallColor(item.special);
      html += '<div class="history-ball special color-' + sc + '">' + item.special + '</div>';
      html += '</div>';
      html += '<div class="history-time">' + item.time + '</div>';
      html += '</div>';
    }
    historyList.innerHTML = html;
  }

  function clearHistory() {
    if (isDrawing) return;
    history = [];
    try { localStorage.removeItem('lucky_history'); } catch(e) {}
    renderHistory();
  }

  // 初始化
  function init() {
    drawBtn = document.getElementById('drawBtn');
    resetBtn = document.getElementById('resetBtn');
    clearBtn = document.getElementById('clearBtn');
    ballsArea = document.getElementById('ballsArea');
    drawInfo = document.getElementById('drawInfo');
    historyList = document.getElementById('historyList');

    loadHistory();
    initBalls();
    renderHistory();

    drawBtn.addEventListener('click', sequentialDraw);
    resetBtn.addEventListener('click', reset);
    clearBtn.addEventListener('click', clearHistory);
  }

  // 确保DOM加载完成后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
