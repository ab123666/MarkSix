.logo-text{font-size:18px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.3)}
.main{max-width:600px;margin:0 auto;padding:16px}
.today-lucky{background:linear-gradient(135deg,#fff5f5,#fff);border-radius:12px;padding:12px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05),inset 0 0 0 1px rgba(231,76,60,0.1);display:flex;align-items:center;justify-content:space-between}
.today-lucky-date{font-size:13px;color:#999;font-weight:600}
.today-lucky-number{display:flex;align-items:center;gap:8px}
.today-lucky-label{font-size:12px;color:#e74c3c;font-weight:700}
.today-lucky-value{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
.today-lucky-value.color-red{background:radial-gradient(circle at 30% 30%,#ff7675,#d63031)}
.today-lucky-value.color-blue{background:radial-gradient(circle at 30% 30%,#74b9ff,#0984e3)}
.today-lucky-value.color-green{background:radial-gradient(circle at 30% 30%,#55efc4,#00b894)}
.draw-info{text-align:center;font-size:14px;color:#666;margin-bottom:12px;min-height:20px;font-weight:600}
.draw-info .current{color:#e74c3c;font-weight:800}
.draw-info .special{color:#e74c3c;font-weight:800}
.balls-area{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;gap:var(--ball-gap);padding:24px 20px;background:var(--bg-soft);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.05),inset 0 0 0 1px rgba(231,76,60,0.1);margin-bottom:16px;min-height:100px;overflow:visible;position:relative}
.ball-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ball{width:var(--ball-size);height:var(--ball-size);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--ball-font);font-weight:900;color:#fff;position:relative;z-index:4;transition:transform 0.15s ease;will-change:transform;background:radial-gradient(circle at 30% 30%,#ff8c00,#ff5000 60%,#cc4000);box-shadow:0 3px 10px rgba(0,0,0,0.25),var(--inset-shadow)}
.ball.color-red{background:radial-gradient(circle at 30% 30%,#ff7675,#d63031 60%,#a02020)}
.ball.color-blue{background:radial-gradient(circle at 30% 30%,#74b9ff,#0984e3 60%,#0652a0)}
.ball.color-green{background:radial-gradient(circle at 30% 30%,#55efc4,#00b894 60%,#008060)}
.ball::before{content:"";position:absolute;top:12%;left:18%;width:35%;height:25%;background:radial-gradient(ellipse,rgba(255,255,255,0.6) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.ball-num{position:relative;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,0.4),0 0 8px rgba(255,255,255,0.3);line-height:1;font-weight:900}
.ball-zodiac{position:relative;z-index:10;font-size:10px;font-weight:600;opacity:0.9;margin-top:1px;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
.ball-inner{display:flex;flex-direction:column;align-items:center;justify-content:center}
.ball.waiting .ball-num{opacity:0.3;font-size:26px;animation:questionPulse 2s ease-in-out infinite}
@keyframes questionPulse{0%,100%{transform:scale(1);opacity:0.3}50%{transform:scale(1.15);opacity:0.5}}
.ball.rolling{transition:transform 0.04s cubic-bezier(0.25,0.46,0.45,0.94);backface-visibility:hidden;transform:translateZ(0);-webkit-transform:translateZ(0)}
.ball.rolling.normal{box-shadow:0 3px 10px rgba(0,0,0,0.25),inset 0 -3px 6px rgba(0,0,0,0.2),inset 0 3px 6px rgba(255,255,255,0.3)}
.ball.rolling.special{box-shadow:0 5px 16px rgba(0,0,0,0.3),inset 0 -3px 6px rgba(0,0,0,0.2),inset 0 3px 6px rgba(255,255,255,0.3),0 0 0 2px rgba(255,215,0,0.8)}
.ball.result{animation:ballResult 0.6s cubic-bezier(0.34,1.56,0.64,1)}
.ball.result::before{animation:haloPulse 1s ease-out}
@keyframes haloPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.8)}100%{box-shadow:0 0 0 30px rgba(255,255,255,0)}}
@keyframes ballResult{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
.ball.result.special{animation:ballResultSpecial 0.7s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 5px 16px rgba(0,0,0,0.3),inset 0 -3px 6px rgba(0,0,0,0.2),inset 0 3px 6px rgba(255,255,255,0.3),0 0 0 2px rgba(255,215,0,0.8)}
@keyframes ballResultSpecial{0%{transform:scale(0.3);opacity:0}35%{transform:scale(1.3);opacity:1}60%{transform:scale(0.9)}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.ball.result .ball-num{animation:numPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.05s both}
@keyframes numPop{0%{transform:scale(0.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.ball.result .ball-zodiac{animation:zodiacFade 0.4s ease 0.2s both;z-index:10;position:relative}
@keyframes zodiacFade{0%{opacity:0;transform:translateY(5px)}100%{opacity:0.95;transform:translateY(0)}}
.ball-label{font-size:10px;color:#999;font-weight:600}
.ball-label.special-label{color:#f39c12;font-weight:700;text-shadow:0 1px 2px rgba(243,156,18,0.3)}
.ball-sep{font-size:32px;color:#1a1a1a;font-weight:900;margin:0 4px;align-self:center;transform:translateY(-9px);text-shadow:none;line-height:1;flex-shrink:0}
.draw-area{display:flex;justify-content:center;margin-bottom:12px}
.btn-large{padding:14px 48px;font-size:18px;min-width:200px}
.btn-primary{background:linear-gradient(135deg,var(--primary-dark),var(--primary),var(--primary-light));color:#fff;border:none;border-radius:25px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(231,76,60,0.4);transition:all 0.15s ease;touch-action:manipulation}
.btn-primary:active:not(:disabled){transform:scale(0.96);box-shadow:0 2px 8px rgba(231,76,60,0.3)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary.drawing{animation:btnPulse 1s ease-in-out infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 16px rgba(231,76,60,0.4)}50%{box-shadow:0 4px 24px rgba(231,76,60,0.7)}}
.action-area{display:flex;justify-content:center;gap:12px;margin-bottom:24px}
.btn-outline{background:#fff;color:#666;border:1.5px solid #e0e0e0;border-radius:20px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s ease;min-height:40px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.btn-outline:active:not(:disabled){transform:scale(0.96);border-color:var(--primary);color:var(--primary);background:#fef5f5}
.btn-outline:disabled{opacity:0.4;cursor:not-allowed}
.history-area{background:var(--bg-soft);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04),inset 0 0 0 1px rgba(231,76,60,0.08)}
.history-title{font-size:15px;font-weight:700;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.history-title::before{content:"✿";font-size:16px;color:var(--primary)}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{display:flex;align-items:center;gap:10px;padding:10px;background:#fff5f5;border-radius:8px;border:1px solid rgba(231,76,60,0.06)}
.history-index{font-size:11px;color:#999;font-weight:600;min-width:32px}
.history-balls{display:flex;gap:3px;flex-wrap:nowrap;flex:1;min-width:0}
.history-ball{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;background:radial-gradient(circle at 30% 30%,#ff8c00,#ff5000)}
.history-ball.special{background:radial-gradient(circle at 30% 30%,#ff6b6b,#e63946)}
.history-ball.color-red{background:radial-gradient(circle at 30% 30%,#ff7675,#d63031)}
.history-ball.color-blue{background:radial-gradient(circle at 30% 30%,#74b9ff,#0984e3)}
.history-ball.color-green{background:radial-gradient(circle at 30% 30%,#55efc4,#00b894)}
.history-time{font-size:10px;color:#bbb;min-width:50px;text-align:right}
.history-empty{text-align:center;padding:24px;color:#ccc;font-size:12px}
.particle-box{position:absolute;pointer-events:none;overflow:visible;z-index:5}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:particleFly 0.9s ease-out forwards;will-change:transform,opacity}
@keyframes particleFly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0) rotate(360deg);opacity:0}}
.star-particle{border-radius:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:starFly 1.1s ease-out forwards;will-change:transform,opacity}
@keyframes starFly{0%{transform:translate(0,0) scale(0) rotate(0deg);opacity:1}20%{transform:translate(calc(var(--tx)*0.2),calc(var(--ty)*0.2)) scale(1.2) rotate(90deg);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0) rotate(540deg);opacity:0}}
.shockwave{position:absolute;top:50%;left:50%;width:20px;height:20px;border:2px solid rgba(255,215,0,0.4);border-radius:50%;transform:translate(-50%,-50%);animation:shockwaveExpand 0.7s ease-out forwards;pointer-events:none;will-change:transform,opacity}
@keyframes shockwaveExpand{0%{transform:translate(-50%,-50%) scale(1);opacity:0.5}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
.petal-particle{border-radius:0 100% 0 100%;animation:petalFly 1s ease-out forwards;will-change:transform,opacity}
@keyframes petalFly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0.3) rotate(180deg);opacity:0}}
@media(max-width:480px){:root{--ball-size:44px;--ball-font:17px;--ball-gap:5px}.balls-area{padding:16px 24px;min-height:95px}.ball.waiting .ball-num{font-size:20px}.ball-zodiac{font-size:9px}.ball-sep{font-size:24px;transform:translateY(-8px);margin:0 2px}.ball-label{font-size:9px}.btn-large{padding:12px 36px;font-size:16px;min-width:160px}}
@media(max-width:420px){:root{--ball-size:40px;--ball-font:16px;--ball-gap:4px}.balls-area{padding:16px 20px;min-height:90px}.ball.waiting .ball-num{font-size:18px}.ball-zodiac{font-size:8px}.ball-sep{font-size:22px;transform:translateY(-7px);margin:0 2px}.ball-label{font-size:8px}.btn-large{padding:11px 32px;font-size:15px;min-width:150px}.history-ball{width:19px;height:19px;font-size:9px}.history-balls{gap:2px}}
@media(max-width:380px){:root{--ball-size:36px;--ball-font:14px;--ball-gap:3px}.balls-area{padding:14px 18px;min-height:85px}.ball.waiting .ball-num{font-size:16px}.ball-zodiac{font-size:7px}.ball-sep{font-size:20px;transform:translateY(-6px);margin:0 2px}.ball-label{font-size:7px}.btn-large{padding:10px 28px;font-size:14px;min-width:140px}.history-ball{width:18px;height:18px;font-size:9px}.history-balls{gap:2px}}
@media(max-width:350px){:root{--ball-size:32px;--ball-font:13px;--ball-gap:2px}.balls-area{padding:12px 16px;min-height:80px}.ball.waiting .ball-num{font-size:14px}.ball-zodiac{font-size:6px}.ball-sep{font-size:18px;transform:translateY(-5px);margin:0 1px}.ball-label{font-size:6px}.btn-large{padding:9px 24px;font-size:13px;min-width:130px}.history-ball{width:16px;height:16px;font-size:8px}.history-balls{gap:1px}.history-index{font-size:10px;min-width:26px}.history-time{font-size:9px;min-width:42px}.history-item{gap:5px;padding:7px}}
@media(max-height:500px) and (orientation:landscape){.header-inner{padding:8px 16px}.main{padding:12px 16px 20px}.balls-area{padding:16px;min-height:100px}:root{--ball-size:50px;--ball-font:20px}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="logo"><div class="logo-icon"></div><div class="logo-text">琼花开奖器</div></div></div></header>
<main class="main">
  <div class="today-lucky" id="todayLucky">
    <div class="today-lucky-date" id="todayDate"></div>
    <div class="today-lucky-number"><span class="today-lucky-label">今日幸运号码</span><div class="today-lucky-value" id="todayLuckyNum"></div></div>
  </div>
  <div class="draw-info" id="drawInfo">点击「开始开奖」，见证幸运时刻</div>
  <div class="balls-area" id="ballsArea"></div>
  <div class="draw-area"><button class="btn-primary btn-large" id="drawBtn">开始开奖</button></div>
  <div class="action-area"><button class="btn-outline" id="resetBtn">重置</button><button class="btn-outline" id="clearBtn">清空历史</button></div>
  <div class="history-area"><div class="history-title">历史开奖记录</div><div class="history-list" id="historyList"><div class="history-empty">暂无开奖记录</div></div></div>
  <div style="text-align:center;padding:20px;color:rgba(231,76,60,0.3);font-size:12px;letter-spacing:2px;">✿ 琼花开奖器 ✿</div>
</main>
<script>
(function(){
'use strict';
var CFG={NORMAL:6,MIN:1,MAX:49,ROLL:50,GAP:250};
var balls=[],drawing=false,history=[],actx=null,alive=false;
var $draw,$reset,$clear,$area,$info,$hist,$date,$lucky;
var ZOD=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
var RED=new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
var BLUE=new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
var yi=((new Date().getFullYear()-2026+6)%12+12)%12;
function rnd(a,b){return Math.random()*(b-a)+a;}
function rndi(a,b){return Math.floor(rnd(a,b+1));}
function pick(a){return a[(Math.random()*a.length)|0];}
function pad(n){return n<10?'0'+n:''+n;}
function zodiac(n){return ZOD[((yi-(n-1))%12+12)%12];}
function color(n){return RED.has(n)?'red':BLUE.has(n)?'blue':'green';}
var lucky={};
(function(){var d=[31,29,31,30,31,30,31,31,30,31,30,31],c=[];for(var m=1;m<=12;m++)for(var x=1;x<=d[m-1];x++)for(var w=1;w<=7;w++)c.push({m:m,d:x,w:w,p:m*x*w});c.sort(function(a,b){return a.p-b.p;});c.forEach(function(v,i){lucky[v.m+'_'+v.d+'_'+v.w]=(i%49)+1;});})();
function todayLucky(){var n=new Date(),m=n.getMonth()+1,d=n.getDate(),w=n.getDay()||7;return lucky[m+'_'+d+'_'+w];}
function renderToday(){var n=new Date(),m=n.getMonth()+1,d=n.getDate(),w=n.getDay();$date.textContent=m+'月'+d+'日 周'+['日','一','二','三','四','五','六'][w];var v=todayLucky();$lucky.textContent=v;$lucky.className='today-lucky-value color-'+color(v);}
function keepAlive(){if(alive||!actx)return;alive=true;try{var o=actx.createOscillator(),g=actx.createGain();g.gain.value=1e-5;o.connect(g);g.connect(actx.destination);o.start();}catch(e){}}
function wake(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}if(!actx)return;if(actx.state==='suspended')actx.resume().then(keepAlive).catch(keepAlive);else keepAlive();}
function safe(fn){if(!actx)return;if(actx.state==='running')fn();else actx.resume().then(fn).catch(function(){setTimeout(fn,10);});}
function bindAudio(){['click','touchstart','mouseover','scroll','touchmove'].forEach(function(e){var t=e==='scroll'?window:document;t.addEventListener(e,wake,{passive:true});});document.addEventListener('visibilitychange',function(){if(!document.hidden)wake();});}
function rollSnd(){safe(function(){if(!actx||actx.state!=='running')return;try{var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880+Math.random()*200;o.type='sine';var t=actx.currentTime;g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);o.start(t);o.stop(t+0.05);}catch(e){}});}
function resSnd(delay,sp){delay=delay||0;safe(function(){if(!actx||actx.state!=='running')return;try{var f=sp?[1046.5,1318.51,1567.98,2093,2637.02]:[523.25,659.25,783.99,1046.5],v=sp?0.16:0.18,gap=sp?0.02:0.03,dec=sp?0.35:0.5,base=actx.currentTime+delay;f.forEach(function(fr,i){var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=fr;o.type=sp?'triangle':'sine';var t=base+i*gap;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.015);g.gain.exponentialRampToValueAtTime(0.001,t+dec);o.start(t);o.stop(t+dec+0.05);});}catch(e){}});}
function genNums(){var a=[];for(var i=CFG.MIN;i<=CFG.MAX;i++)a.push(i);for(var j=a.length-1;j>0;j--){var k=(Math.random()*(j+1))|0,t=a[j];a[j]=a[k];a[k]=t;}return{normal:a.slice(0,CFG.NORMAL),special:a[CFG.NORMAL]};}
function mkBall(i,sp){var w=document.createElement('div');w.className='ball-wrap';var b=document.createElement('div');b.className='ball '+(sp?'special':'normal')+' waiting';b.innerHTML='<div class="ball-inner"><span class="ball-num">?</span><span class="ball-zodiac"></span></div>';var l=document.createElement('div');l.className='ball-label'+(sp?' special-label':'');l.textContent=sp?'特码':'第'+(i+1)+'个';w.appendChild(b);w.appendChild(l);return w;}
function initBalls(){$area.innerHTML='';balls=[];for(var i=0;i<CFG.NORMAL;i++){var w=mkBall(i,false);$area.appendChild(w);balls.push({el:w.querySelector('.ball'),v:null,sp:false});}var s=document.createElement('div');s.className='ball-sep';s.textContent='+';$area.appendChild(s);var sw=mkBall(CFG.NORMAL,true);$area.appendChild(sw);balls.push({el:sw.querySelector('.ball'),v:null,sp:true});}
function particles(el,sp){var r=el.getBoundingClientRect(),st=window.pageYOffset||document.documentElement.scrollTop,sl=window.pageXOffset||document.documentElement.scrollLeft;var box=document.createElement('div');box.className='particle-box';box.style.cssText='left:'+(r.left+sl)+'px;top:'+(r.top+st)+'px;width:'+r.width+'px;height:'+r.height+'px;';var rad=r.width/2,oy=-rad*(sp?0.93:0.77);var c1=sp?['#ffd700','#ffb700','#ff8c00','#fff','#ffeb3b']:['#ff8c00','#ffb700','#fff','#ff5000','#ffd700'];var c2=sp?['#ffd700','#ffb700','#ff8c00','#fff','#ffeb3b','#ff6b6b']:['#ff6b6b','#ee5a6f','#ff8fa3','#fff','#ffb3c1','#ffd700'];var html='';for(var i=0;i<20;i++){var sz=rnd(3,9),ang=rnd(0,6.283),dist=rnd(60,140),c=pick(c1),sx=Math.cos(ang)*rad*0.8,sy=Math.sin(ang)*rad*0.8+oy;html+='<div class="particle" style="width:'+sz+'px;height:'+sz+'px;background:'+c+';box-shadow:0 0 '+(sz*2)+'px '+c+';left:calc(50% + '+sx+'px);top:calc(50% + '+sy+'px);--tx:'+(Math.cos(ang)*dist)+'px;--ty:'+(Math.sin(ang)*dist)+'px;animation-delay:'+rnd(0,0.08)+'s;opacity:0.85"></div>';}for(var j=0;j<8;j++){var ps=rnd(6,14),pa=rnd(0,6.283),pd=rnd(60,130),pc=pick(c2),px=Math.cos(pa)*rad*0.8,py=Math.sin(pa)*rad*0.8+oy;html+='<div class="particle petal-particle" style="width:'+ps+'px;height:'+ps+'px;background:'+pc+';box-shadow:0 0 '+(ps*1.5)+'px '+pc+';left:calc(50% + '+px+'px);top:calc(50% + '+py+'px);--tx:'+(Math.cos(pa)*pd)+'px;--ty:'+(Math.sin(pa)*pd)+'px;opacity:0.8"></div>';}for(var k=0;k<4;k++){var ss=rnd(5,10),sa=rnd(0,6.283),sd=rnd(70,150),sc=pick(['#ffd700','#fff','#ffeb3b','#ff8c00']),stx=Math.cos(sa)*rad*0.8,sty=Math.sin(sa)*rad*0.8+oy;html+='<div class="particle star-particle" style="width:'+ss+'px;height:'+ss+'px;background:'+sc+';box-shadow:0 0 '+(ss*2.5)+'px '+sc+';left:calc(50% + '+stx+'px);top:calc(50% + '+sty+'px);--tx:'+(Math.cos(sa)*sd)+'px;--ty:'+(Math.sin(sa)*sd)+'px;opacity:0.75"></div>';}html+='<div class="shockwave"'+(sp?' style="border-color:rgba(255,215,0,0.5)"':'')+'></div>';box.innerHTML=html;document.body.appendChild(box);setTimeout(function(){box.remove();},900);}
function drawBall(obj,fv,idx,exc){return new Promise(function(res){var el=obj.el,num=el.querySelector('.ball-num'),zod=el.querySelector('.ball-zodiac');var lbl=obj.sp?'特码':'第'+(idx+1)+'个号码',fz=zodiac(fv),fc=color(fv);$info.innerHTML='正在开出 <span class="'+(obj.sp?'special':'current')+'">'+lbl+'</span>...';el.classList.remove('waiting');el.classList.add('rolling');var FC=(2000/CFG.ROLL)|0,SC=5,TOT=FC+SC;var seq=new Array(TOT),fb={};for(var ei=0;ei<exc.length;ei++)fb[exc[ei]]=true;fb[fv]=true;var prev=0;for(var i=TOT-1;i>=0;i--){var n;do{n=rndi(CFG.MIN,CFG.MAX);}while(fb[n]||n===prev);seq[i]=n;prev=n;}var si=0,bc=0;function upd(n,sc){num.textContent=n;zod.textContent=zodiac(n);el.classList.remove('color-red','color-blue','color-green');el.classList.add('color-'+color(n));var rot=(bc%2===0?1:-1)*rnd(2,6),ty=-rnd(3,9)*sc;el.style.transform='scale('+sc+') rotate('+rot+'deg) translateY('+ty+'px)';bc++;rollSnd();setTimeout(function(){el.style.transform='scale(1) rotate(0deg) translateY(0)';},55);}var fast=setInterval(function(){upd(seq[si],rnd(1.08,1.16));si++;if(si>=FC){clearInterval(fast);if(idx>0&&balls[idx-1])balls[idx-1].el.classList.remove('result');slow();}},CFG.ROLL);var spd=[120,160,200,260,340],scl=[1.1,1.08,1.06,1.04,1.02],sli=0;function slow(){if(sli>=SC){el.classList.remove('rolling');el.style.transform='';el.classList.add('result');el.classList.remove('color-red','color-blue','color-green');el.classList.add('color-'+fc);num.textContent=fv;zod.textContent=fz;obj.v=fv;particles(el,obj.sp);$info.innerHTML=obj.sp?'🎉 特码开出 <span class="special">'+fv+' '+fz+'</span>！':'第'+(idx+1)+'个号码开出 <span class="current">'+fv+' '+fz+'</span>';setTimeout(res,300);return;}upd(seq[si],scl[sli]);if(sli===SC-1)resSnd(spd[sli]/1000,obj.sp);si++;sli++;setTimeout(slow,spd[sli-1]);}});}
function startDraw(){if(drawing)return;function go(){drawing=true;$draw.disabled=true;$draw.classList.add('drawing');$draw.textContent='开奖中...';$reset.disabled=true;$clear.disabled=true;initBalls();setTimeout(function(){var nums=genNums(),all=nums.normal.concat([nums.special]),drawn=[],idx=0;function next(){if(idx>=balls.length){setTimeout(function(){$info.innerHTML='🎉 开奖完成！';saveHist(nums);renderHist();drawing=false;$draw.disabled=false;$draw.classList.remove('drawing');$draw.textContent='再开一次';$reset.disabled=false;$clear.disabled=false;},400);return;}drawBall(balls[idx],all[idx],idx,drawn).then(function(){drawn.push(all[idx]);idx++;if(idx<balls.length)setTimeout(next,CFG.GAP);else next();});}next();},200);}if(actx&&actx.state==='running')go();else{wake();if(actx)actx.resume().then(go).catch(go);else go();}}
function reset(){if(drawing)return;initBalls();$info.textContent='点击「开始开奖」，见证幸运时刻';$draw.textContent='开始开奖';}
function saveHist(nums){var n=new Date(),t=(n.getMonth()+1)+'/'+n.getDate()+' '+pad(n.getHours())+':'+pad(n.getMinutes());history.unshift({normal:nums.normal,special:nums.special,time:t});if(history.length>20)history.pop();try{localStorage.setItem('lucky_history',JSON.stringify(history));}catch(e){}}
function loadHist(){try{var s=localStorage.getItem('lucky_history');if(s)history=JSON.parse(s)||[];}catch(e){history=[];}}
function renderHist(){if(history.length===0){$hist.innerHTML='<div class="history-empty">暂无开奖记录</div>';return;}var html='';for(var i=0;i<history.length;i++){var it=history[i];html+='<div class="history-item"><div class="history-index">#'+(history.length-i)+'</div><div class="history-balls">';for(var j=0;j<it.normal.length;j++)html+='<div class="history-ball color-'+color(it.normal[j])+'">'+it.normal[j]+'</div>';html+='<div class="history-ball special color-'+color(it.special)+'">'+it.special+'</div></div><div class="history-time">'+it.time+'</div></div>';}$hist.innerHTML=html;}
function clearHist(){if(drawing)return;history=[];try{localStorage.removeItem('lucky_history');}catch(e){}renderHist();}
function init(){$draw=document.getElementById('drawBtn');$reset=document.getElementById('resetBtn');$clear=document.getElementById('clearBtn');$area=document.getElementById('ballsArea');$info=document.getElementById('drawInfo');$hist=document.getElementById('historyList');$date=document.getElementById('todayDate');$lucky=document.getElementById('todayLuckyNum');try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}bindAudio();loadHist();initBalls();renderHist();renderToday();$draw.addEventListener('click',startDraw);$reset.addEventListener('click',reset);$clear.addEventListener('click',clearHist);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
