.logo-text{font-size:18px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.3)}
.main{max-width:600px;margin:0 auto;padding:16px}
.today-lucky{background:#fff;border-radius:12px;padding:6px 0;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:flex;align-items:center;overflow:hidden}
.date-text{display:flex;flex-direction:column;gap:2px;align-items:flex-start}.date-main{font-size:15px;font-weight:700;color:#333;}.date-lunar{font-size:13px;color:#888;}.today-lucky-date{font-size:13px;color:#1a1a1a;font-weight:600;flex:0 0 55%;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:12px 16px;position:relative}
.today-lucky-date::before{content:"✿";color:var(--primary);font-size:22px;flex-shrink:0}
.today-lucky-number{display:flex;align-items:center;justify-content:center;gap:10px;flex:0 0 45%;padding:10px 12px}
.today-lucky-label{font-size:24px;font-weight:900;font-family:"Ma Shan Zheng","华文行楷","STXingkai","行楷","楷体","KaiTi","华文新魏","STXinwei","方正舒体","FZShuTi",cursive;color:#e74c3c;letter-spacing:3px}
.today-lucky-value{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.2),inset 0 1px 2px rgba(255,255,255,0.3)}
.today-lucky-value.color-red{background:radial-gradient(circle at 30% 30%,#ff7675,#d63031)}
.today-lucky-value.color-blue{background:radial-gradient(circle at 30% 30%,#74b9ff,#0984e3)}
.today-lucky-value.color-green{background:radial-gradient(circle at 30% 30%,#55efc4,#00b894)}
.draw-info{text-align:center;font-size:14px;color:#666;margin-bottom:12px;min-height:20px;font-weight:600}
.draw-info .current{color:#e74c3c;font-weight:800}
.draw-info .special{color:#e74c3c;font-weight:800}
.balls-area{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;gap:var(--ball-gap);padding:24px 20px;background:var(--bg-soft);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.05),inset 0 0 0 1px rgba(231,76,60,0.1);margin-bottom:16px;min-height:100px;overflow:visible;position:relative}
.ball-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ball{width:var(--ball-size);height:var(--ball-size);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--ball-font);font-weight:900;color:#fff;position:relative;z-index:4;transition:transform 0.15s ease;will-change:transform;background:radial-gradient(circle at 30% 30%,#ff8c00,#ff5000 60%,#cc4000);box-shadow:0 3px 10px rgba(0,0,0,0.25),var(--inset-shadow)}
.ball.color-red{background:radial-gradient(circle at 30% 30%,#ff7675,#d63031 60%,#a02020)}
.ball.color-blue{background:radial-gradient(circle at 30% 30%,#74b9ff,#0984e3 60%,#0652a0)}
.ball.color-green{background:radial-gradient(circle at 30% 30%,#55efc4,#00b894 60%,#008060)}
.ball::before{content:"";position:absolute;top:12%;left:18%;width:35%;height:25%;background:radial-gradient(ellipse,rgba(255,255,255,0.6) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.ball-num{position:relative;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,0.4),0 0 8px rgba(255,255,255,0.3);line-height:1;font-weight:900}
.ball-zodiac{position:relative;z-index:10;font-size:10px;font-weight:600;opacity:0.9;margin-top:1px;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
.ball-inner{display:flex;flex-direction:column;align-items:center;justify-content:center}
.ball.waiting .ball-num{opacity:0.3;font-size:26px;animation:questionPulse 2s ease-in-out infinite}
@keyframes questionPulse{0%,100%{transform:scale(1);opacity:0.3}50%{transform:scale(1.15);opacity:0.5}}
.ball.rolling{}
.ball.rolling.normal{box-shadow:0 3px 10px rgba(0,0,0,0.25),inset 0 -3px 6px rgba(0,0,0,0.2),inset 0 3px 6px rgba(255,255,255,0.3)}
.ball.rolling.special{box-shadow:0 3px 10px rgba(0,0,0,0.25),inset 0 -3px 6px rgba(0,0,0,0.2),inset 0 3px 6px rgba(255,255,255,0.3)}
@media(max-width:768px){.ball.result.special{box-shadow:0 0 0 1.5px rgba(255,215,0,0.7),0 2px 6px rgba(0,0,0,0.2),inset 0 -2px 4px rgba(0,0,0,0.15),inset 0 2px 4px rgba(255,255,255,0.2)}}
.ball.result{animation:ballResult 0.6s cubic-bezier(0.34,1.56,0.64,1)}
.ball.result::before{animation:haloPulse 1s ease-out}
@keyframes haloPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,0.8)}100%{box-shadow:0 0 0 30px rgba(255,255,255,0)}}
@keyframes ballResult{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
.ball.result.special{animation:ballResult 0.6s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 0 0 2px rgba(255,215,0,0.8),0 3px 10px rgba(0,0,0,0.25),inset 0 -3px 6px rgba(0,0,0,0.2),inset 0 3px 6px rgba(255,255,255,0.3);will-change:transform}
@keyframes ballResultSpecial{0%{transform:scale(0.3);opacity:0}35%{transform:scale(1.3);opacity:1}60%{transform:scale(0.9)}80%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.ball.result .ball-num{animation:numPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.05s both}
@keyframes numPop{0%{transform:scale(0.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.ball.result .ball-zodiac{animation:zodiacFade 0.4s ease 0.2s both;z-index:10;position:relative}
@keyframes zodiacFade{0%{opacity:0;transform:translateY(5px)}100%{opacity:0.95;transform:translateY(0)}}
.ball-label{font-size:10px;color:#999;font-weight:600}
.ball-label.special-label{color:#f39c12;font-weight:700;text-shadow:0 1px 2px rgba(243,156,18,0.3)}
.ball-sep{font-size:32px;color:#1a1a1a;font-weight:900;margin:0 4px;align-self:center;transform:translateY(-9px);text-shadow:none;line-height:1;flex-shrink:0}
.draw-area{display:flex;justify-content:center;margin-bottom:12px}
.btn-large{padding:14px 48px;font-size:18px;min-width:200px}
.btn-primary{background:linear-gradient(135deg,var(--primary-dark),var(--primary),var(--primary-light));color:#fff;border:none;border-radius:25px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(231,76,60,0.4);transition:all 0.15s ease;touch-action:manipulation}
.btn-primary:active:not(:disabled){transform:scale(0.96);box-shadow:0 2px 8px rgba(231,76,60,0.3)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary.drawing{animation:btnPulse 1s ease-in-out infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 4px 16px rgba(231,76,60,0.4)}50%{box-shadow:0 4px 24px rgba(231,76,60,0.7)}}
.action-area{display:flex;justify-content:center;gap:12px;margin-bottom:24px}
.btn-outline{background:#fff;color:#666;border:1.5px solid #e0e0e0;border-radius:20px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s ease;min-height:40px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.btn-outline:active:not(:disabled){transform:scale(0.96);border-color:var(--primary);color:var(--primary);background:#fef5f5}
.btn-outline:disabled{opacity:0.4;cursor:not-allowed}
.history-area{background:var(--bg-soft);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04),inset 0 0 0 1px rgba(231,76,60,0.08)}
.history-title{font-size:15px;font-weight:700;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.history-title::before{content:"✿";font-size:16px;color:var(--primary)}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{display:flex;align-items:center;gap:10px;padding:10px;background:#fff5f5;border-radius:8px;border:1px solid rgba(231,76,60,0.06)}
.history-index{font-size:11px;color:#999;font-weight:600;min-width:32px}
.history-balls{display:flex;gap:3px;flex-wrap:nowrap;flex:1;min-width:0}
.history-ball{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;background:radial-gradient(circle at 30% 30%,#ff8c00,#ff5000)}
.history-ball.special{background:radial-gradient(circle at 30% 30%,#ff6b6b,#e63946);box-shadow:0 0 0 2px rgba(255,215,0,0.8)}
.history-ball.color-red{background:radial-gradient(circle at 30% 30%,#ff7675,#d63031)}
.history-ball.color-blue{background:radial-gradient(circle at 30% 30%,#74b9ff,#0984e3)}
.history-ball.color-green{background:radial-gradient(circle at 30% 30%,#55efc4,#00b894)}
.history-time{font-size:10px;color:#bbb;min-width:50px;text-align:right}
.history-empty{text-align:center;padding:24px;color:#ccc;font-size:12px}
.particle-box{position:absolute;pointer-events:none;overflow:visible;z-index:5}
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:particleFly 0.9s ease-out forwards;will-change:transform,opacity}
@keyframes particleFly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0) rotate(360deg);opacity:0}}
.star-particle{border-radius:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:starFly 1.1s ease-out forwards;will-change:transform,opacity}
@keyframes starFly{0%{transform:translate(0,0) scale(0) rotate(0deg);opacity:1}20%{transform:translate(calc(var(--tx)*0.2),calc(var(--ty)*0.2)) scale(1.2) rotate(90deg);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0) rotate(540deg);opacity:0}}
.shockwave{position:absolute;top:50%;left:50%;width:20px;height:20px;border:2px solid rgba(255,215,0,0.4);border-radius:50%;transform:translate(-50%,-50%);animation:shockwaveExpand 0.7s ease-out forwards;pointer-events:none;will-change:transform,opacity}
@keyframes shockwaveExpand{0%{transform:translate(-50%,-50%) scale(1);opacity:0.5}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
.petal-particle{border-radius:0 100% 0 100%;animation:petalFly 1s ease-out forwards;will-change:transform,opacity}
@keyframes petalFly{0%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0.3) rotate(180deg);opacity:0}}
@media(max-width:480px){:root{--ball-size:44px;--ball-font:17px;--ball-gap:5px}.balls-area{padding:16px 24px;min-height:95px}.ball.waiting .ball-num{font-size:20px}.ball-zodiac{font-size:9px}.ball-sep{font-size:24px;transform:translateY(-8px);margin:0 2px}.ball-label{font-size:9px}.btn-large{padding:12px 36px;font-size:16px;min-width:160px}.today-lucky-date{flex:0 0 52%;font-size:15px;font-weight:700;color:#333;padding:0 10px}.today-lucky-number{flex:0 0 48%;padding:8px 8px 8px 16px;gap:12px;justify-content:flex-end}.today-lucky-label{font-size:17px;letter-spacing:0px}.today-lucky-value{width:28px;height:28px;font-size:13px;flex-shrink:0}}
@media(max-width:420px){:root{--ball-size:40px;--ball-font:16px;--ball-gap:4px}.balls-area{padding:16px 20px;min-height:90px}.ball.waiting .ball-num{font-size:18px}.ball-zodiac{font-size:8px}.ball-sep{font-size:22px;transform:translateY(-7px);margin:0 2px}.ball-label{font-size:8px}.btn-large{padding:11px 32px;font-size:15px;min-width:150px}.history-ball{width:19px;height:19px;font-size:9px}.history-balls{gap:2px}.today-lucky-date{flex:0 0 50%;font-size:14px;font-weight:700;color:#333;padding:0 8px}.today-lucky-number{flex:0 0 50%;padding:7px 7px 7px 14px;gap:10px;justify-content:flex-end}.today-lucky-label{font-size:15px;letter-spacing:0px}.today-lucky-value{width:26px;height:26px;font-size:12px}}
@media(max-width:380px){:root{--ball-size:36px;--ball-font:14px;--ball-gap:3px}.balls-area{padding:14px 18px;min-height:85px}.ball.waiting .ball-num{font-size:16px}.ball-zodiac{font-size:7px}.ball-sep{font-size:20px;transform:translateY(-6px);margin:0 2px}.ball-label{font-size:7px}.btn-large{padding:10px 28px;font-size:14px;min-width:140px}.history-ball{width:18px;height:18px;font-size:9px}.history-balls{gap:2px}}
@media(max-width:350px){:root{--ball-size:32px;--ball-font:13px;--ball-gap:2px}.balls-area{padding:12px 16px;min-height:80px}.ball.waiting .ball-num{font-size:14px}.ball-zodiac{font-size:6px}.ball-sep{font-size:18px;transform:translateY(-5px);margin:0 1px}.ball-label{font-size:6px}.btn-large{padding:9px 24px;font-size:13px;min-width:130px}.history-ball{width:16px;height:16px;font-size:8px}.history-balls{gap:1px}.history-index{font-size:10px;min-width:26px}.history-time{font-size:9px;min-width:42px}.history-item{gap:5px;padding:7px}}
@media(max-height:500px) and (orientation:landscape){.header-inner{padding:8px 16px}.main{padding:12px 16px 20px}.balls-area{padding:16px;min-height:100px}:root{--ball-size:50px;--ball-font:20px}}
</style>

function init(){$draw=document.getElementById('drawBtn');$reset=document.getElementById('resetBtn');$clear=document.getElementById('clearBtn');$area=document.getElementById('ballsArea');$info=document.getElementById('drawInfo');$hist=document.getElementById('historyList');$date=document.getElementById('todayDate');$lucky=document.getElementById('todayLuckyNum');try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}bindAudio();initBGM();loadHist();initBalls();renderHist();renderToday();function scheduleNextShichen(){var now=bjTime(),h=now.getUTCHours(),nextH=(h%2===0)?h+1:h+2;if(nextH>=24)nextH-=24;var next=new Date(now.getTime());next.setUTCHours(nextH,0,0,0);if(next<=now)next.setUTCDate(next.getUTCDate()+1);setTimeout(function(){renderToday();scheduleNextShichen();},next-now);}scheduleNextShichen();$draw.addEventListener('click',startDraw);$reset.addEventListener('click',reset);$clear.addEventListener('click',clearHist);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
